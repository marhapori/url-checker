name: Shoprenter URL ellenorzes

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Bemeneti fajl utvonala a repoban"
        required: false
        default: "input/termekek.xlsx"
      url_column:
        description: "Az URL-eket tartalmazo oszlop neve"
        required: false
        default: "URL"
      min_delay:
        description: "Minimum varakozas ket keres között (masodperc)"
        required: false
        default: "1.5"
      max_delay:
        description: "Maximum varakozas ket keres között (masodperc)"
        required: false
        default: "2.5"
      timeout:
        description: "Olvasasi timeout (mp)"
        required: false
        default: "12"
      connect_timeout:
        description: "Kapcsolodasi timeout (mp)"
        required: false
        default: "6"
      save_every:
        description: "Reszmentes ennyi soronkent"
        required: false
        default: "100"
      use_head:
        description: "HEAD + GET fallback hasznalata (true/false)"
        required: false
        default: "true"

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show git info
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "SHA: $GITHUB_SHA"
          git log --oneline -n 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean output folder
        run: |
          rm -rf output
          mkdir -p output

      - name: Show input folder
        run: |
          echo "Input mappa tartalma:"
          ls -lah input || true

      - name: Preview selected input file
        shell: bash
        run: |
          python - <<'PY'
from pathlib import Path
import pandas as pd

input_file = "${{ github.event.inputs.input_file || 'input/termekek.xlsx' }}"
url_column = "${{ github.event.inputs.url_column || 'URL' }}"
p = Path(input_file)

print(f"Hasznalt input fajl: {p}")
print(f"Letezik: {p.exists()}")

if not p.exists():
    raise SystemExit("A bemeneti fajl nem talalhato.")

print(f"Fajlmeret byte-ban: {p.stat().st_size}")

if p.suffix.lower() in [".xlsx", ".xls"]:
    df = pd.read_excel(p)
elif p.suffix.lower() == ".csv":
    df = pd.read_csv(p)
else:
    raise SystemExit(f"Nem tamogatott fajltipus: {p.suffix}")

print(f"Oszlopok: {list(df.columns)}")
print(f"Sorok szama: {len(df)}")

if url_column not in df.columns:
    raise SystemExit(f"Nincs ilyen URL oszlop: {url_column}")

sample = df[url_column].astype(str).head(10).tolist()
print("Elso 10 URL:")
for i, u in enumerate(sample, start=1):
    print(f"{i}. {u}")
PY

      - name: Run URL checker
        shell: bash
        run: |
          CMD=(python check_urls.py \
            --input "${{ github.event.inputs.input_file || 'input/termekek.xlsx' }}" \
            --url-column "${{ github.event.inputs.url_column || 'URL' }}" \
            --min-delay "${{ github.event.inputs.min_delay || '1.5' }}" \
            --max-delay "${{ github.event.inputs.max_delay || '2.5' }}" \
            --timeout "${{ github.event.inputs.timeout || '12' }}" \
            --connect-timeout "${{ github.event.inputs.connect_timeout || '6' }}" \
            --save-every "${{ github.event.inputs.save_every || '100' }}")

          if [ "${{ github.event.inputs.use_head || 'true' }}" = "false" ]; then
            CMD+=(--no-head)
          fi

          printf 'Futtatando parancs: '
          printf '%q ' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Show output folder
        run: |
          echo "Output mappa tartalma:"
          ls -lah output || true

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoprenter-url-check-results
          path: output/*
          if-no-files-found: error
          retention-days: 14
