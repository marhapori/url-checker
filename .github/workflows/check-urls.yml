name: Shoprenter URL ellenorzes

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Bemeneti fajl utvonala a repoban"
        required: true
        default: "input/termekek.xlsx"
      url_column:
        description: "Az URL-eket tartalmazo oszlop neve"
        required: true
        default: "URL"
      min_delay:
        description: "Minimum varakozas ket keres kozott (masodperc)"
        required: true
        default: "1.5"
      max_delay:
        description: "Maximum varakozas ket keres kozott (masodperc)"
        required: true
        default: "2.5"
      timeout:
        description: "Olvasasi timeout (mp)"
        required: true
        default: "12"
      connect_timeout:
        description: "Kapcsolodasi timeout (mp)"
        required: true
        default: "6"
      save_every:
        description: "Reszmentes ennyi soronkent"
        required: true
        default: "100"
      use_head:
        description: "HEAD + GET fallback hasznalata (true/false)"
        required: true
        default: "true"

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show git info
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "SHA: $GITHUB_SHA"
          git log --oneline -n 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean output folder
        run: |
          rm -rf output
          mkdir -p output

      - name: Show input folder
        run: |
          echo "Input mappa tartalma:"
          ls -lah input || true

      - name: Show selected input file info
        env:
          INPUT_FILE: ${{ github.event.inputs.input_file }}
        run: |
          echo "Hasznalt input fajl: $INPUT_FILE"
          if [ -f "$INPUT_FILE" ]; then
            echo "Fajl adatai:"
            ls -lah "$INPUT_FILE"
            echo "SHA256:"
            sha256sum "$INPUT_FILE"
          else
            echo "NINCS ilyen fajl: $INPUT_FILE"
            exit 1
          fi

      - name: Run URL checker
        shell: bash
        env:
          INPUT_FILE: ${{ github.event.inputs.input_file }}
          URL_COLUMN: ${{ github.event.inputs.url_column }}
          MIN_DELAY: ${{ github.event.inputs.min_delay }}
          MAX_DELAY: ${{ github.event.inputs.max_delay }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          CONNECT_TIMEOUT: ${{ github.event.inputs.connect_timeout }}
          SAVE_EVERY: ${{ github.event.inputs.save_every }}
          USE_HEAD: ${{ github.event.inputs.use_head }}
        run: |
          CMD=(python check_urls.py
            --input "$INPUT_FILE"
            --url-column "$URL_COLUMN"
            --min-delay "$MIN_DELAY"
            --max-delay "$MAX_DELAY"
            --timeout "$TIMEOUT"
            --connect-timeout "$CONNECT_TIMEOUT"
            --save-every "$SAVE_EVERY"
          )

          if [ "$USE_HEAD" = "false" ]; then
            CMD+=(--no-head)
          fi

          echo "Futtatando parancs:"
          printf '%q ' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"

      - name: Show output folder
        run: |
          echo "Output mappa tartalma:"
          ls -lah output || true

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoprenter-url-check-results
          path: output/*
          if-no-files-found: error
          retention-days: 14
